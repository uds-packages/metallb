addresspools:
  default:
    ipAddressPoolCIDR: "{{ .vars.ip_address_pool }}"
  adminIngress:
    ipAddressPool: "{{ .vars.ip_address_admin_ingressgateway }}"
  tenantIngress:
    ipAddressPool: "{{ .vars.ip_address_tenant_ingressgateway }}"
  passthroughIngress:
    ipAddressPool: "{{ .vars.ip_address_passthrough_ingressgateway }}"
  interface: "{{ .vars.interface }}"
