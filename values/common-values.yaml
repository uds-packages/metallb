controller:
  securityContext:
    fsGroup: 65532
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532

speaker:
  securityContext:
    fsGroup: 65532
    runAsUser: 0
  frr:
    enabled: false

frrk8s:
  enabled: false

# Pool configuration is packaged with MetalLB. Allow it to be created during
# transient webhook Service endpoint unavailability after an install or upgrade.
crds:
  validationFailurePolicy: Ignore
